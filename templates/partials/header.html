<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{{ get_url(path='@/_index.md') }}" aria-label="kael.cpp home">
      <img class="brand__logo" src="{{ get_url(path='img/logo.png') }}" alt="kael.cpp" width="96" height="50">
    </a>
    <nav class="site-nav" aria-label="Main">
      {% for item in config.extra.nav %}
        {% set url = get_url(path=item.path) %}
        <a href="{{ url }}"{% if current_url and url in current_url %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
      <a href="{{ config.extra.kael_repo }}">github</a>
    </nav>
    <div class="site-tools">
      <button class="tool search-open" type="button" aria-label="Search" title="Search (/)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <kbd>/</kbd>
      </button>
      <button class="tool theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>
